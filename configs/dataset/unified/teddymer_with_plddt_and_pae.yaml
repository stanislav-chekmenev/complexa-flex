# Teddymer dimer view with per-residue AF2 pLDDT labels and directional
# per-residue-pair PAE labels read from parent AFDB tars via
# locator_rows.parquet. Consumed by the existing pLDDT confidence sidecar
# and (PR-B) by the asymmetric PaeHead.
#
# DO NOT add `ted_dimers` to defaults — it injects `path_column: path`
# that breaks Teddymer's tar-offset loading.

defaults:
  - _self_

datamodule:
  _target_: proteinfoundation.datasets.teddymer.dataset.TeddymerDimerDataModule
  dimers_parquet: ${oc.env:TEDDYMER_VIEW_ROOT,/netscratch/schekmenev/teddymer_v1_blob}/dimers.parquet
  locator_parquet: ${oc.env:TEDDYMER_VIEW_ROOT,/netscratch/schekmenev/teddymer_v1_blob}/locator_rows.parquet
  afdb_proteomes_root: ${oc.env:AFDB_PROTEOMES_ROOT,/netscratch/schekmenev/teddymer_v1_blob}
  batch_size: 4
  num_workers: 8
  train_split: 0.99
  id_column: dimer_id
  pin_memory: true
  seed: 0

  filters:
    - "complexa_filter == True"

  atomarray_transforms: []

  # Pipeline order: geometry transforms first (residue-count preserving), then
  # AFDB label transforms emit per-residue / per-pair labels aligned with the
  # post-geometry token order. `chain_idx` is derived from `data.chains` after
  # this loop returns, so it tracks any reordering the geometry transforms do.
  #
  # The binder/target generative transforms from ted_dimers.yaml
  # (CroppingTransform2, ContactTransform, ExtractTargetCoordinatesTransform,
  # FilterTargetResiduesTransform) are deliberately omitted: this pipeline
  # trains the confidence head on the full dimer, not on a binder-target
  # split, and FilterTargetResiduesTransform would desync `pae_residue_pair`
  # whose second axis it does not slice.
  #
  # Geometry posture matches the inference-time distribution of the frozen
  # Proteina trunk: per-step `center_every_step=True` on the `bb_ca`
  # modality recenters generated coords to full-COM-zero over Calpha only
  # (rdn_flow_matcher.py:436, _force_zero_com). `CenteringTransform` here
  # uses `center_mode="full"`, `data_mode="bb_ca"` to match that. The
  # trunk's `feats_seq` / `feats_pair_repr` (read from `complexa.ckpt`)
  # request neither `chain_break_seq` nor frame fields, so
  # `ChainBreakPerResidueTransform` and `OpenFoldFrameTransform` are not
  # included; chain identity reaches the trunk via dataset-native
  # `data.chains` / `data.chain_idx`.
  atom37_transforms:
    - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
    - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
    - _target_: proteinfoundation.datasets.transforms.CenteringTransform
      center_mode: "full"
      data_mode: "bb_ca"
    - _target_: proteinfoundation.datasets.transforms.AddPLDDTFromParentAFDB
      bin_width: 2.0
      max_bins: 50
      scale_max: 100.0
    - _target_: proteinfoundation.datasets.transforms.AddPAEFromParentAFDB
      bin_width: 0.5
      max_bins: 64
      scale_max: 31.75
