trunk_eval_t: 0.99
trunk_ckpt_path: ${oc.env:CKPT_DIR,ckpts}/complexa.ckpt
autoencoder_ckpt_path: ${oc.env:CKPT_DIR,ckpts}/complexa_ae.ckpt
opt:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  warmup_steps: 500
  min_lr: 5.0e-6
loss:
  ce_weight: 0.7
  smooth_l1_weight: 0.1
  label_smoothing: 0.05
max_epochs: 50
precision: bf16-mixed
gradient_clip_val: 1.0
